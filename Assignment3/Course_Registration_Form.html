<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration Form</title>
</head>
<body>
    <header>
    <h1>Form Registration</h1>
    <form>
        <fieldset>
            <legend>Student Information</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"><br><br>

            <label for="course">Select course:</label>
            <select id="Course" name="Course">
                <options>Web Devlopment</options>
                <options>Data Science</options>
                <options>AI & ML</options>
                <options>Cyber Security</options>
            </select><br><br>
            <input type="submit" value="Register">
        </fieldset>
    </form>
    <h2> Available Cours Schedule</h2>
    <table border="1">
        <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Instructor</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>8:00 -12:00</td>
            <td>AS</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>8:00 -12:00</td>
            <td>AS</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>8:00 -12:00</td>
            <td>AS</td>
        </tr>
    </table>
    </header>
</body>
</html>
